spring:
  application:
    name: api-gateway

  config:
    import: "configserver:https://config-server-2pkz.onrender.com"

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

server:
  port: 8086

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: https://eureka-service-0gqf.onrender.com/eureka/