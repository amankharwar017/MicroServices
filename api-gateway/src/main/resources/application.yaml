spring:
  application:
    name: api-gateway

  config:
    import: "configserver:https://config-server-2pkz.onrender.com"

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

server:
  port: 8086

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: https://eureka-service-0gqf.onrender.com/eureka/

render:
  services:
    auth-service: https://auth-service-fr33.onrender.com
    user-service: https://user-service-4h9p.onrender.com
    shift-service: https://shift-service-3be9.onrender.com
    master-service: https://master-service-6mja.onrender.com
    common-service: https://common-service-tc3i.onrender.com