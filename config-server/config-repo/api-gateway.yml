spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "https://shift-master-ui.vercel.app"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/user/**

            - id: shift-service
              uri: lb://SHIFT-SERVICE
              predicates:
                - Path=/shift/**

            - id: master-service
              uri: lb://MASTER-SERVICE
              predicates:
                - Path=/master/**

            - id: common-service
              uri: lb://COMMON-SERVICE
              predicates:
                - Path=/common/**

server:
  port: ${PORT:8086}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: https://eureka-service-0gqf.onrender.com/eureka/

render:
  services:
    auth-service: https://auth-service-fr33.onrender.com
    user-service: https://user-service-4h9p.onrender.com
    shift-service: https://shift-service-3be9.onrender.com
    master-service: https://master-service-6mja.onrender.com
    common-service: https://common-service-tc3i.onrender.com