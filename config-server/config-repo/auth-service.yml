
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shift_master
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: https://eureka-service-7p23.onrender.com/eureka/
