
spring:
  application:
    name: auth-service
  config:
    import: "optional:configserver:https://config-server-ybdw.onrender.com"
  datasource:
    url: jdbc:mysql://localhost:3306/shift_master
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/