
spring:
  application:
    name: auth-service
  config:
    import: configserver:https://config-server-2pkz.onrender.com
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

server:
  port: ${PORT:8081}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: https://eureka-service-0gqf.onrender.com/eureka/